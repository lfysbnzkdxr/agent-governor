[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "agent-governor"
version = "0.4.0"
description = "Embedded multi-tenant Agent governance engine - cost attribution, declarative policies, and audit"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lfysbnzkdxr" },
]
keywords = ["agent", "llm", "governance", "multi-tenant", "cost-control", "policy-engine", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "litellm>=1.40,<1.95",
    "pydantic>=2.5,<3",
    "structlog>=24.1",
]

[project.optional-dependencies]
dag = ["networkx>=3.0"]
resilience = []
policy = ["pyyaml>=6.0"]
telemetry = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp>=1.25",
]
redis = ["redis[hiredis]>=5.0"]
# DEPRECATED: will be removed in v1.0
mcp = ["mcp>=1.0"]
# DEPRECATED: will be removed in v1.0
http = ["httpx>=0.27"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.25"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.0",
    "pyyaml>=6.0",
]
all = ["agent-governor[dag,policy,telemetry,redis]"]

[project.scripts]
agent-governor-report = "agent_governor.cli.report:main"

[project.urls]
Homepage = "https://github.com/lfysbnzkdxr/agent-governor"
Repository = "https://github.com/lfysbnzkdxr/agent-governor"
Issues = "https://github.com/lfysbnzkdxr/agent-governor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_governor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
